name: flutter_makefile
description: A CLI tool for Flutter projects that provides Makefile-style commands for common development tasks like building, testing, and running Flutter applications.
version: 1.0.1+2
repository: https://github.com/alpha-sow/flutter_makefile
homepage: https://github.com/alpha-sow/flutter_makefile
issue_tracker: https://github.com/alpha-sow/flutter_makefile/issues

topics:
  - cli
  - flutter
  - makefile
  - development-tools

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.7.0
  cli_completion: ^0.5.1
  mason_logger: ^0.3.3
  path: ^1.9.1
  pub_updater: ^0.5.0

dev_dependencies:
  build_runner: ^2.8.0
  build_verify: ^3.1.1
  build_version: ^2.1.3
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0

executables:
  flutter_makefile:
